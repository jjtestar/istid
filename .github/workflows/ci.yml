name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # `next build` never queries the database (every route is
      # server-rendered on demand, nothing is statically generated from
      # Prisma data), so these placeholders only need to satisfy schema
      # resolution — they're not used to reach a real database.
      DATABASE_URL: "postgresql://user:password@localhost:5432/istid_ci"
      DATABASE_URL_UNPOOLED: "postgresql://user:password@localhost:5432/istid_ci"
      AUTH_SECRET: "ci-build-placeholder-not-a-real-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - run: npx next build

      # After the build, so .next/types exists for the generated route helpers.
      - name: Typecheck
        run: npm run typecheck

      - name: Check function bundle sizes
        run: npm run check:bundle-size
