name: Build bundle size check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # `next build` never queries the database (every route is
      # server-rendered on demand, nothing is statically generated from
      # Prisma data), so these placeholders only need to satisfy schema
      # resolution — they're not used to reach a real database.
      DATABASE_URL: "postgresql://user:password@localhost:5432/istid_ci"
      DATABASE_URL_UNPOOLED: "postgresql://user:password@localhost:5432/istid_ci"
      AUTH_SECRET: "ci-build-placeholder-not-a-real-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `next typegen` first: route types like LayoutProps<"/"> are generated
      # into .next/types, so a bare `tsc --noEmit` would fail on a fresh
      # checkout. Runs before the build so a type error fails fast.
      - name: Typecheck
        run: npm run typecheck

      # Database-free regression scripts for the DST/date-format and PWA/proxy
      # contracts — cheap enough to run on every PR instead of relying on
      # everyone remembering to run them locally.
      - name: Schedule tests
        run: npm run test:schedule

      - name: PWA tests
        run: npm run test:pwa

      - name: Format tests
        run: npm run test:format

      - run: npx next build

      - name: Check function bundle sizes
        run: npm run check:bundle-size
